[package]
name = "bbtidy"
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Conservative formatter, linter, and lexer for BitBake metadata"
repository = "https://github.com/jorisguex/bbtidy"
keywords = ["bitbake", "yocto", "formatter", "linter", "lexer"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
globset = "0.4.16"
libc = "0.2.189"
logos = "0.15.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
similar = "3.1.1"
toml = "1.1.4"

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
proptest = "1.6.0"

[[bench]]
name = "layer_analysis"
harness = false

[package]
name = "bbtidy"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Experimental formatter, linter, and lexer for BitBake metadata"
repository = "https://github.com/jorisguex/bbtidy"
keywords = ["bitbake", "yocto", "formatter", "linter", "lexer"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
logos = "0.15.1"
similar = "3.1.1"

name: Publish to crates.io

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish after the caller's release gate succeeds"
        required: true
        type: boolean
      tag:
        description: "Validated release tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate crate release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate release metadata
        run: python3 scripts/release_metadata.py --tag "${{ inputs.tag }}"
      - name: Run packaging and workflow tests
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"
          python3 scripts/check_workflows.py
      - name: Validate Rust package
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --locked
          cargo publish --locked --dry-run
          cargo package --locked --list
          cargo bench --locked --bench layer_analysis
          git diff --check

  publish:
    name: Publish crate
    if: ${{ inputs.publish }}
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: crates-io-release
      url: https://crates.io/crates/bbtidy
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

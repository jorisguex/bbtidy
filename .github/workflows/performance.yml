name: Performance budgets

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    name: Synthetic ${{ matrix.operation }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        operation: [format-check, format, json, sarif]
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Build release binary
        run: cargo build --locked --release
      - name: Collect synthetic performance evidence
        run: >-
          python3 scripts/benchmark_performance.py
          --bbtidy target/release/bbtidy
          --synthetic
          --operation "${{ matrix.operation }}"
          --mode offline
          --repetitions 3
          --minimum-duration-ms 100
          --runner-class github-ubuntu-24.04-x86_64
          --output "performance-${{ matrix.operation }}.json"
      - name: Check synthetic budgets
        run: >-
          python3 scripts/check_performance_budget.py
          --budgets tests/performance/budgets.json
          --evidence "performance-${{ matrix.operation }}.json"
      - name: Upload raw synthetic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-synthetic-${{ matrix.operation }}
          path: performance-${{ matrix.operation }}.json
          if-no-files-found: error

  scaling:
    name: Parameterized Rust scaling benchmark
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run scaling benchmark
        run: cargo bench --locked --bench layer_analysis
      - name: Upload benchmark log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-scaling-${{ github.run_id }}
          path: target/criterion
          if-no-files-found: warn

  weekly-guidance:
    name: Weekly BitBake reference guidance
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Publish measurement contract
        run: |
          set -euo pipefail
          python3 scripts/check_performance_budget.py --help
          python3 scripts/benchmark_performance.py --help
          test -s tests/performance/README.md
          test -s tests/performance/budgets.json

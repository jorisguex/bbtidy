name: Performance reference campaign

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact candidate commit to measure"
        required: true
        type: string
  push:
    branches:
      - codex/performance-reference-campaign

permissions:
  contents: read

concurrency:
  group: performance-reference-${{ inputs.source_commit || github.sha }}
  cancel-in-progress: false

jobs:
  synthetic-reference:
    name: Sequential Ubuntu 24.04 reference run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
      - name: Build release binary
        run: cargo build --locked --release
      - name: Collect three independent synthetic runs
        run: |
          set -euo pipefail
          mkdir -p performance-reference
          for run in 1 2 3; do
            for operation in format-check format-write json sarif; do
              python3 scripts/benchmark_performance.py \
                --bbtidy target/release/bbtidy \
                --synthetic \
                --operation "$operation" \
                --mode offline \
                --repetitions 7 \
                --minimum-duration-ms 1000 \
                --runner-class github-ubuntu-24.04-x86_64 \
                --output "performance-reference/run-$run-$operation.json"
            done
          done
      - name: Upload raw reference evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-reference-${{ inputs.source_commit || github.sha }}
          path: performance-reference
          if-no-files-found: error

  offline-corpus-reference:
    name: ${{ matrix.name }} offline reference run
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: yocto-5.0
            manifest: tests/upstream-corpora/yocto-5.0-scarthgap.json
            workload: yocto-5.0-offline
          - name: yocto-6.0
            manifest: tests/upstream-corpora/yocto-6.0-wrynose.json
            workload: yocto-6.0-offline
          - name: community
            manifest: tests/upstream-corpora/community-master.json
            workload: yocto-community-offline
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install BitBake host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes chrpath cpio diffstat gawk iputils-ping libacl1 liblz4-tool locales python3-git python3-jinja2 python3-pexpect python3-subunit socat texinfo zstd
          sudo locale-gen en_US.UTF-8
      - name: Build bbtidy and prepare the pinned corpus
        run: >-
          cargo build --locked --release &&
          python3 scripts/check_upstream_corpus.py
          --manifest "${{ matrix.manifest }}"
          --workspace compatibility-workspace
          --evidence-dir compatibility-evidence
          ${{ matrix.name == 'community' && '--skip-bitbake' || '' }}
        env:
          LANG: en_US.UTF-8
      - name: Collect three independent offline runs
        run: |
          set -euo pipefail
          mkdir -p performance-reference
          performance_root="$RUNNER_TEMP/bbtidy-performance-source"
          mkdir -p "$performance_root"
          export PERFORMANCE_ROOT="$performance_root"
          export PERFORMANCE_MANIFEST="${{ matrix.manifest }}"
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          formatted = Path("compatibility-workspace/formatted")
          destination = Path(os.environ["PERFORMANCE_ROOT"])
          manifest = json.loads(Path(os.environ["PERFORMANCE_MANIFEST"]).read_text(encoding="utf-8"))
          for layer in manifest["layers"]:
              source = formatted / layer["repository"] / layer["path"]
              target = destination / layer["repository"] / layer["path"]
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copytree(source, target, symlinks=True)
          PY
          for run in 1 2 3; do
            python3 scripts/benchmark_performance.py \
              --bbtidy target/release/bbtidy \
              --source-root "$performance_root" \
              --operation json \
              --mode offline \
              --repetitions 5 \
              --runner-class github-ubuntu-24.04-x86_64 \
              --workload "${{ matrix.workload }}" \
              --output "performance-reference/${{ matrix.name }}-run-$run.json"
          done
          if [ "${{ matrix.name }}" != "community" ]; then
            build_dir="compatibility-workspace/build-original"
            bitbake="$({
              python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path(os.environ["PERFORMANCE_MANIFEST"]).read_text(encoding="utf-8")
          )
          formatted_root = Path("compatibility-workspace/formatted")
          candidates = [
              formatted_root / repository["name"] / suffix
              for repository in manifest["repositories"]
              for suffix in ("bin/bitbake", "bitbake/bin/bitbake")
          ]
          matches = [path for path in candidates if path.is_file()]
          if len(matches) != 1:
              raise SystemExit("expected exactly one BitBake executable")
          print(matches[0])
          PY
            })"
            test -f "$build_dir/conf/bblayers.conf"
            test -x "$bitbake"
            for run in 1 2 3; do
              warm_build_dir="$RUNNER_TEMP/bbtidy-warm-build-$run"
              cp -a "$build_dir" "$warm_build_dir"
              python3 scripts/benchmark_performance.py \
                --bbtidy target/release/bbtidy \
                --source-root "$warm_build_dir" \
                --operation bitbake \
                --mode cold \
                --repetitions 1 \
                --runner-class github-ubuntu-24.04-x86_64 \
                --workload "${{ matrix.name }}-bitbake-cold" \
                --bitbake-command "$bitbake" \
                --timeout-seconds 3600 \
                --output "performance-reference/${{ matrix.name }}-run-$run-bitbake-cold.json"
              python3 scripts/benchmark_performance.py \
                --bbtidy target/release/bbtidy \
                --source-root "$build_dir" \
                --operation bitbake \
                --mode warm \
                --repetitions 5 \
                --runner-class github-ubuntu-24.04-x86_64 \
                --workload "${{ matrix.name }}-bitbake-warm" \
                --bitbake-command "$bitbake" \
                --timeout-seconds 3600 \
                --output "performance-reference/${{ matrix.name }}-run-$run-bitbake-warm.json"
              python3 scripts/benchmark_performance.py \
                --bbtidy target/release/bbtidy \
                --source-root "$build_dir" \
                --operation semantic \
                --mode cold \
                --repetitions 1 \
                --runner-class github-ubuntu-24.04-x86_64 \
                --workload "${{ matrix.name }}-semantic-full" \
                --bitbake-command "$bitbake" \
                --timeout-seconds 3600 \
                --output "performance-reference/${{ matrix.name }}-run-$run-semantic-full.json"
            done
          fi
      - name: Upload raw offline reference evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-reference-offline-${{ matrix.name }}-${{ inputs.source_commit || github.sha }}
          path: performance-reference
          if-no-files-found: error

  review-campaign:
    name: Review reference campaign
    needs: [synthetic-reference, offline-corpus-reference]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - name: Download raw reference evidence
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: performance-reference-*
          path: performance-reference-raw
      - name: Generate review report
        run: |
          set -euo pipefail
          records=()
          while IFS= read -r record; do
            records+=(--evidence "$record")
          done < <(find performance-reference-raw -type f -name '*.json' -print | sort)
          python3 scripts/review_performance_campaign.py \
            --budgets tests/performance/budgets.json \
            --output performance-reference-review.json \
            "${records[@]}"
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-reference-review-${{ inputs.source_commit || github.sha }}
          path: performance-reference-review.json
          if-no-files-found: error

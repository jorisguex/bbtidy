name: Python package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-smoke-test:
    name: Build and quality-check Python package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate release metadata
        run: python scripts/release_metadata.py
      - name: Test packaging helpers
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Check repository diff
        run: git diff --check
      - name: Run Rust tests
        run: cargo test --all-targets --locked
      - name: Run layer-analysis benchmark
        run: cargo bench --locked --bench layer_analysis
      - name: Build wheel and verified source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.11.5
          manylinux: "2_17"
          args: >-
            --release
            --locked
            --sdist
            --compatibility pypi
            --out dist
      - name: Install wheel and run bbtidy
        run: python scripts/smoke_test_package.py --kind wheel dist
      - name: Install source distribution and run bbtidy
        run: python scripts/smoke_test_package.py --kind sdist dist

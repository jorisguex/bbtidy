name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.release-metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate release metadata
        id: release-metadata
        run: python scripts/release_metadata.py --github-output "$GITHUB_OUTPUT"
      - name: Test packaging helpers
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Check repository diff
        run: git diff --check
      - name: Run Rust tests
        run: cargo test --all-targets --locked
      - name: Run layer-analysis benchmark
        run: cargo bench --locked --bench layer_analysis
      - name: Validate Cargo package
        run: cargo publish --locked --dry-run
      - name: Inspect packaged crate contents
        run: cargo package --locked --list

  wheels:
    name: Wheel (${{ matrix.platform.name }})
    needs: validate
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.11.5
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: >-
            --release
            --locked
            --compatibility pypi
            --out dist
          sccache: ${{ github.ref_type != 'tag' }}
      - name: Install wheel and run bbtidy
        if: ${{ matrix.platform.smoke_test }}
        run: python scripts/smoke_test_package.py --kind wheel dist
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error

  verify-release-binaries:
    name: Verify Linux release binaries
    needs: verify-distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download release wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: Extract standalone binaries
        run: >-
          python scripts/prepare_release_binaries.py
          --wheel-dir dist
          --output-dir release-binaries
          --tag "$GITHUB_REF_NAME"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Smoke-test Linux binaries
        run: |
          set -euo pipefail
          binary_dir="$GITHUB_WORKSPACE/release-binaries"
          python scripts/release_metadata.py \
            --asset-tag "$GITHUB_REF_NAME" \
            --linux-smoke-plan > smoke-plan.tsv

          while IFS=$'\t' read -r platform image binary expected_version; do
            echo "Testing ${binary} on ${platform}"
            actual_version="$(timeout 60s docker run --rm --network none \
              --platform "$platform" \
              --volume "$binary_dir:/release:ro" \
              "$image" \
              "/release/${binary}" --version)"
            test "$actual_version" = "$expected_version"
          done < smoke-plan.tsv

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build source distribution
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.11.5
          command: sdist
          args: --out dist
      - name: Install source distribution and run bbtidy
        run: python scripts/smoke_test_package.py --kind sdist dist
      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify-distributions:
    name: Verify published distribution set
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: Verify wheel and source distribution metadata
        run: python scripts/verify_release_artifacts.py --dist-dir dist

  publish:
    name: Publish distributions
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: [verify-distributions, verify-release-binaries]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/bbtidy/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  github-release:
    name: GitHub Release binaries
    needs: [verify-distributions, verify-release-binaries]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download release wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: Extract standalone binaries
        run: >-
          python scripts/prepare_release_binaries.py
          --wheel-dir dist
          --output-dir release-binaries
          --tag "$GITHUB_REF_NAME"
      - name: Create SHA-256 manifest
        run: >-
          python scripts/create_release_checksums.py
          --binary-dir release-binaries
          --output SHA256SUMS
      - name: Verify SHA-256 manifest
        run: (cd release-binaries && sha256sum -c ../SHA256SUMS)
      - name: Create GitHub release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-binaries/* SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-binaries/* SHA256SUMS \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

name: Build and publish Python distributions

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish after the caller's release gate succeeds"
        required: true
        type: boolean
      tag:
        description: "Validated release tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.release-metadata.outputs.matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate release metadata
        id: release-metadata
        run: python3 scripts/release_metadata.py --tag "${{ inputs.tag }}" --github-output "$GITHUB_OUTPUT"
      - name: Run packaging and workflow tests
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"
          python3 scripts/check_workflows.py
      - name: Run Rust and package validation
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --locked
          cargo bench --locked --bench layer_analysis
          cargo publish --locked --dry-run
          cargo package --locked --list
          git diff --check

  wheels:
    name: Wheel (${{ matrix.platform.name }})
    needs: validate
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.11.5
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: >-
            --release
            --locked
            --compatibility pypi
            --out dist
          sccache: false
      - name: Install wheel and run bbtidy
        if: ${{ matrix.platform.smoke_test }}
        run: python3 scripts/smoke_test_package.py --kind wheel dist
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.11.5
          command: sdist
          args: --out dist
      - name: Install source distribution and run bbtidy
        run: python3 scripts/smoke_test_package.py --kind sdist dist
      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify-distributions:
    name: Verify published distribution set
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: Verify wheel and source distribution metadata
        run: python3 scripts/verify_release_artifacts.py --dist-dir dist --tag "${{ inputs.tag }}"

  verify-release-binaries:
    name: Verify Linux release binaries
    needs: verify-distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download release wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: Extract standalone binaries
        run: >-
          python3 scripts/prepare_release_binaries.py
          --wheel-dir dist
          --output-dir release-binaries
          --tag "${{ inputs.tag }}"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Smoke-test Linux binaries
        run: |
          set -euo pipefail
          binary_dir="$GITHUB_WORKSPACE/release-binaries"
          python3 scripts/release_metadata.py \
            --tag "${{ inputs.tag }}" \
            --asset-tag "${{ inputs.tag }}" \
            --linux-smoke-plan > smoke-plan.tsv
          while IFS=$'\t' read -r platform image binary expected_version; do
            echo "Testing ${binary} on ${platform}"
            actual_version="$(timeout 60s docker run --rm --network none \
              --platform "$platform" \
              --volume "$binary_dir:/release:ro" \
              "$image" \
              "/release/${binary}" --version)"
            test "$actual_version" = "$expected_version"
          done < smoke-plan.tsv

  publish:
    name: Publish distributions
    if: ${{ inputs.publish }}
    needs: [verify-distributions, verify-release-binaries]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/bbtidy/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

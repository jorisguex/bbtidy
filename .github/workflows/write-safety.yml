name: Cross-platform write safety

on:
  workflow_call:
    inputs:
      source_commit:
        description: "Exact source commit to validate"
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  write-safety:
    name: Write and fix on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - name: Exercise transaction failure recovery and CLI writes
        run: cargo test --bin bbtidy --test cli --locked

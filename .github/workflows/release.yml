name: Release orchestrator

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional version tag to rehearse; defaults to the Cargo version"
        required: false
        type: string
        default: ""
      publish:
        description: "Publish this run; requires the protected release environment"
        required: false
        type: boolean
        default: false
      protected_confirmation:
        description: "Type PUBLISH to authorize a manual publication"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate tag and release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate release metadata
        id: metadata
        env:
          INPUT_TAG: ${{ inputs.tag || '' }}
          INPUT_PUBLISH: ${{ inputs.publish || false }}
          INPUT_CONFIRMATION: ${{ inputs.protected_confirmation || '' }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "bbtidy"))')"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="v$version"
          fi
          python3 scripts/check_release_version.py --tag "$tag"
          python3 scripts/release_metadata.py --tag "$tag"
          publish=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            publish=true
          elif [ "$INPUT_PUBLISH" = true ]; then
            test "$INPUT_CONFIRMATION" = PUBLISH
            publish=true
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  release-gate:
    name: Blocking release gate
    needs: metadata
    uses: ./.github/workflows/release-gate.yml
    with:
      release_version: ${{ needs.metadata.outputs.version }}
      release_tag: ${{ needs.metadata.outputs.tag }}
      source_commit: ${{ github.sha }}
    permissions:
      contents: read

  publish-crates:
    name: Validate and publish crates.io package
    needs: [metadata, release-gate]
    uses: ./.github/workflows/publish-crates.yml
    with:
      publish: ${{ needs.metadata.outputs.publish == 'true' }}
      tag: ${{ needs.metadata.outputs.tag }}
    permissions:
      contents: read

  publish-python:
    name: Build and publish Python distributions
    needs: [metadata, release-gate]
    uses: ./.github/workflows/publish-pypi.yml
    with:
      publish: ${{ needs.metadata.outputs.publish == 'true' }}
      tag: ${{ needs.metadata.outputs.tag }}
    permissions:
      contents: read

  github-release:
    name: Create GitHub Release with binaries and evidence
    needs: [metadata, release-gate, publish-python]
    if: ${{ needs.metadata.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    environment:
      name: release-publish
    permissions:
      contents: write
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download release wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: Extract standalone binaries
        run: >-
          python3 scripts/prepare_release_binaries.py
          --wheel-dir dist
          --output-dir release-binaries
          --tag "${{ needs.metadata.outputs.tag }}"
      - name: Create SHA-256 manifest
        run: >-
          python3 scripts/create_release_checksums.py
          --binary-dir release-binaries
          --output SHA256SUMS
      - name: Verify SHA-256 manifest
        run: (cd release-binaries && sha256sum -c ../SHA256SUMS)
      - name: Download durable compatibility evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: release-evidence
      - name: Verify evidence checksum
        run: (cd release-evidence && sha256sum -c release-evidence.sha256)
      - name: Create GitHub release and upload all evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          assets=(release-binaries/* SHA256SUMS release-evidence/release-evidence.tar.gz release-evidence/release-evidence.sha256)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

name: Upstream compatibility

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upstream-compatibility.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/check_upstream_corpus.py"
      - "src/**"
      - "tests/fixtures/syntax-boundaries/**"
      - "tests/upstream-corpora/**"
      - "tests/syntax_boundaries.rs"
      - "tests/test_upstream_corpus.py"
  pull_request:
    paths:
      - ".github/workflows/upstream-compatibility.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/check_upstream_corpus.py"
      - "src/**"
      - "tests/fixtures/syntax-boundaries/**"
      - "tests/upstream-corpora/**"
      - "tests/syntax_boundaries.rs"
      - "tests/test_upstream_corpus.py"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supported:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Yocto 5.0 / BitBake 2.8
            artifact: yocto-5.0-scarthgap
            manifest: tests/upstream-corpora/yocto-5.0-scarthgap.json
          - name: Yocto 6.0 / BitBake 2.18
            artifact: yocto-6.0-wrynose
            manifest: tests/upstream-corpora/yocto-6.0-wrynose.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install BitBake host tools
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes
          chrpath cpio diffstat gawk iputils-ping libacl1 liblz4-tool locales
          python3-git python3-jinja2 python3-pexpect python3-subunit socat
          texinfo zstd &&
          sudo locale-gen en_US.UTF-8
      - name: Build bbtidy
        run: cargo build --locked --release
      - name: Test compatibility harness
        run: python -m unittest discover -s tests -p "test_upstream_corpus.py"
      - name: Check pinned upstream corpus
        run: >-
          python scripts/check_upstream_corpus.py
          --manifest "${{ matrix.manifest }}"
          --workspace compatibility-workspace
          --evidence-dir compatibility-evidence
        env:
          LANG: en_US.UTF-8
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-evidence-${{ matrix.artifact }}
          path: compatibility-evidence
          if-no-files-found: warn

  development:
    name: Yocto master (non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install BitBake host tools
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes
          chrpath cpio diffstat gawk iputils-ping libacl1 liblz4-tool locales
          python3-git python3-jinja2 python3-pexpect python3-subunit socat
          texinfo zstd &&
          sudo locale-gen en_US.UTF-8
      - name: Build bbtidy
        run: cargo build --locked --release
      - name: Check moving upstream corpus
        run: >-
          python scripts/check_upstream_corpus.py
          --manifest tests/upstream-corpora/yocto-master.json
          --workspace compatibility-workspace
          --evidence-dir compatibility-evidence
        env:
          LANG: en_US.UTF-8
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-evidence-yocto-master
          path: compatibility-evidence
          if-no-files-found: warn

  community:
    name: Community layers (non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Build bbtidy
        run: cargo build --locked --release
      - name: Check pinned community corpus
        run: >-
          python scripts/check_upstream_corpus.py
          --manifest tests/upstream-corpora/community-master.json
          --skip-bitbake
          --workspace compatibility-workspace
          --evidence-dir compatibility-evidence
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-evidence-community
          path: compatibility-evidence
          if-no-files-found: warn

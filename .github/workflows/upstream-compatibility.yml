name: Upstream compatibility

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upstream-compatibility.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/check_upstream_corpus.py"
      - "src/**"
      - "tests/fixtures/syntax-boundaries/**"
      - "tests/upstream-corpora/**"
      - "tests/syntax_boundaries.rs"
      - "tests/test_upstream_corpus.py"
  pull_request:
    paths:
      - ".github/workflows/upstream-compatibility.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/check_upstream_corpus.py"
      - "src/**"
      - "tests/fixtures/syntax-boundaries/**"
      - "tests/upstream-corpora/**"
      - "tests/syntax_boundaries.rs"
      - "tests/test_upstream_corpus.py"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supported:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Yocto 5.0 / BitBake 2.8
            manifest: tests/upstream-corpora/yocto-5.0-scarthgap.json
          - name: Yocto 6.0 / BitBake 2.18
            manifest: tests/upstream-corpora/yocto-6.0-wrynose.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install BitBake host tools
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes
          chrpath cpio diffstat gawk iputils-ping libacl1 liblz4-tool locales
          python3-git python3-jinja2 python3-pexpect python3-subunit socat
          texinfo zstd &&
          sudo locale-gen en_US.UTF-8
      - name: Build bbtidy
        run: cargo build --locked --release
      - name: Test compatibility harness
        run: python -m unittest discover -s tests -p "test_upstream_corpus.py"
      - name: Check pinned upstream corpus
        run: python scripts/check_upstream_corpus.py --manifest "${{ matrix.manifest }}"
        env:
          LANG: en_US.UTF-8

  development:
    name: Yocto master (non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install BitBake host tools
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes
          chrpath cpio diffstat gawk iputils-ping libacl1 liblz4-tool locales
          python3-git python3-jinja2 python3-pexpect python3-subunit socat
          texinfo zstd &&
          sudo locale-gen en_US.UTF-8
      - name: Build bbtidy
        run: cargo build --locked --release
      - name: Check moving upstream corpus
        run: >-
          python scripts/check_upstream_corpus.py
          --manifest tests/upstream-corpora/yocto-master.json
        env:
          LANG: en_US.UTF-8

  community:
    name: Community layers (non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Build bbtidy
        run: cargo build --locked --release
      - name: Check pinned community corpus
        run: >-
          python scripts/check_upstream_corpus.py
          --manifest tests/upstream-corpora/community-master.json
          --skip-bitbake

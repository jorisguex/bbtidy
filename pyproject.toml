[build-system]
requires = ["maturin>=1.11.5,<2.0"]
build-backend = "maturin"

[project]
name = "bbtidy"
description = "Experimental formatter, linter, and lexer for BitBake metadata"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joris Guex" }]
keywords = ["bitbake", "yocto", "formatter", "linter", "lexer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Quality Assurance",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/jorisguex/bbtidy"
Repository = "https://github.com/jorisguex/bbtidy"
Issues = "https://github.com/jorisguex/bbtidy/issues"
Changelog = "https://github.com/jorisguex/bbtidy/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "bin"
strip = true

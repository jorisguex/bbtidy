# Current BitBake metadata forms covered by the alpha lexer.
include_all conf/distro/include/maintainers.inc
require conf/machine/include/tune.inc
inherit autotools pkgconfig
inherit_defer ${VARNAME}
addfragments conf/fragments OE_FRAGMENTS OE_FRAGMENTS_METADATA_VARS OE_FRAGMENTS_BUILTIN
addpylib ${LAYERDIR}/lib example
addhandler example_eventhandler
EXPORT_FUNCTIONS do_configure do_compile
addtask package_write_tar before do_build after do_packagedata do_package
deltask do_deploy
export CC
unset do_fetch[noexec]

A = "recursive"
B := "${A}"
C ?= "default"
D ??= "weak default"
E += "append with space"
F =+ "prepend with space"
G .= "append without space"
H =. "prepend without space"

RDEPENDS:${PN}:class-native += "example"
do_fetch[network] = "1"
FILES_${PN} = "/usr/bin/example"

SRC_URI=" \
    file://one.patch \
    file://two.patch \
"
